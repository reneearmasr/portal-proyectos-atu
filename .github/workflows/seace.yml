# Actualiza la página de procesos SEACE del portal (seace/procesos.json y el Excel)
# cada día hábil, consultando la API de datos abiertos del OECE.
name: Actualizar procesos SEACE

on:
  schedule:
    - cron: "0 12 * * 1-5"   # lunes a viernes, 7:00 a. m. hora de Lima (UTC-5)
  workflow_dispatch:          # botón "Run workflow" para actualizar a demanda

permissions:
  contents: write

concurrency:
  group: seace
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Lima
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Consultar procesos y generar archivos
        env:
          # Opcional: si se definen estos secretos, también envía el Excel por Telegram
          SEACE_TELEGRAM_TOKEN: ${{ secrets.SEACE_TELEGRAM_TOKEN }}
          SEACE_TELEGRAM_CHAT_ID: ${{ secrets.SEACE_TELEGRAM_CHAT_ID }}
        run: python .github/scripts/seguimiento_seace.py --portal seace

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seace/procesos.json seace/Procesos_SEACE_ATU.xlsx
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza procesos SEACE ($(date +'%d/%m/%Y %H:%M'))"
            git push
          fi
